<text x="42" y="503" fill="#e8f2ff" font-size="21" font-family="Arial, sans-serif">Parabolic</text><rect x="265" y="485" width="201.6" height="15" rx="3" fill="#49d3c6"/><rect x="265" y="504" width="435.6" height="15" rx="3" fill="#71a9ff"/><text x="475.6" y="498" font-size="15" fill="#cafef5" font-family="Arial">0.56</text><text x="709.6" y="517" font-size="15" fill="#d9e8ff" font-family="Arial">1.21</text>
<text x="42" y="563" fill="#e8f2ff" font-size="21" font-family="Arial, sans-serif">Ogive</text><rect x="265" y="545" width="226.8" height="15" rx="3" fill="#49d3c6"/><rect x="265" y="564" width="435.6" height="15" rx="3" fill="#71a9ff"/><text x="500.8" y="558" font-size="15" fill="#cafef5" font-family="Arial">0.63</text><text x="709.6" y="577" font-size="15" fill="#d9e8ff" font-family="Arial">1.21</text>
<text x="42" y="688" fill="#9eb4cb" font-size="15" font-family="Arial,sans-serif">Recreated from Table 1 of the team's original report, not a photograph of the test.</text>
<text x="42" y="711" fill="#9eb4cb" font-size="15" font-family="Arial,sans-serif">CFD agreement was poor; small force differences between shaped cones were not resolvable.</text>
</svg>