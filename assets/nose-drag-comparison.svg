<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 735" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Drag coefficient by nose shape, wind tunnel versus CFD</title>
<desc id="chart-desc">Eight rocket nose geometries measured in a wind tunnel versus mean full-body CFD drag coefficients, data transcribed from the November 2026 team report. Blunt 1.57 versus 1.22; hemisphere 0.64 versus 1.23; biconic 0.72 versus 1.12; conic 0.73 versus 1.20; bowed 0.63 versus 1.21; elliptical 0.65 versus 1.21; parabolic 0.56 versus 1.21; ogive 0.63 versus 1.21.</desc>
<rect width="1020" height="735" rx="18" fill="#0d1b30"/>
<text x="40" y="52" fill="#ffffff" font-family="Arial,sans-serif" font-size="27" font-weight="bold">Nose cone drag coefficient: physical test vs CFD</text>
<text x="42" y="79" fill="#9cb5d0" font-size="16" font-family="Arial,sans-serif">Eight 3D-printed geometries on one rocket body | November 2026</text>
<rect x="44" y="94" width="14" height="13" rx="3" fill="#49d3c6"/><text x="66" y="106" fill="#b9ccdf" font-size="16" font-family="Arial,sans-serif">Wind-tunnel fitted C&#x2091;</text>
<rect x="330" y="94" width="14" height="13" rx="3" fill="#71a9ff"/><text x="352" y="106" fill="#b9ccdf" font-size="16" font-family="Arial,sans-serif">Mean full-body CFD C&#x2091;</text>
<line x1="265" y1="112" x2="265" y2="616" stroke="#31435b" stroke-dasharray="4 6" stroke-width="1"/><text x="265" y="641" text-anchor="middle" fill="#91a9bf" font-size="14" font-family="Arial,sans-serif">0.0</text>
<line x1="445" y1="112" x2="445" y2="616" stroke="#31435b" stroke-dasharray="4 6" stroke-width="1"/><text x="445" y="641" text-anchor="middle" fill="#91a9bf" font-size="14" font-family="Arial,sans-serif">0.5</text>
<line x1="625" y1="112" x2="625" y2="616" stroke="#31435b" stroke-dasharray="4 6" stroke-width="1"/><text x="625" y="641" text-anchor="middle" fill="#91a9bf" font-size="14" font-family="Arial,sans-serif">1.0</text>
<line x1="805" y1="112" x2="805" y2="616" stroke="#31435b" stroke-dasharray="4 6" stroke-width="1"/><text x="805" y="641" text-anchor="middle" fill="#91a9bf" font-size="14" font-family="Arial,sans-serif">1.5</text>
<text x="42" y="143" fill="#e8f2ff" font-size="21" font-family="Arial, sans-serif">Blunt</text><rect x="265" y="125" width="565.2" height="15" rx="3" fill="#49d3c6"/><rect x="265" y="144" width="439.2" height="15" rx="3" fill="#71a9ff"/><text x="839.2" y="138" font-size="15" fill="#cafef5" font-family="Arial">1.57</text><text x="713.2" y="157" font-size="15" fill="#d9e8ff" font-family="Arial">1.22</text>
<text x="42" y="203" fill="#e8f2ff" font-size="21" font-family="Arial, sans-serif">Hemisphere</text><rect x="265" y="185" width="230.4" height="15" rx="3" fill="#49d3c6"/><rect x="265" y="204" width="442.8" height="15" rx="3" fill="#71a9ff"/><text x="504.4" y="198" font-size="15" fill="#cafef5" font-family="Arial">0.64</text><text x="716.8" y="217" font-size="15" fill="#d9e8ff" font-family="Arial">1.23</text>
<text x="42" y="263" fill="#e8f2ff" font-size="21" font-family="Arial, sans-serif">Biconic</text><rect x="265" y="245" width="259.2" height="15" rx="3" fill="#49d3c6"/><rect x="265" y="264" width="403.2" height="15" rx="3" fill="#71a9ff"/><text x="533.2" y="258" font-size="15" fill="#cafef5" font-family="Arial">0.72</text><text x="677.2" y="277" font-size="15" fill="#d9e8ff" font-family="Arial">1.12</text>
<text x="42" y="323" fill="#e8f2ff" font-size="21" font-family="Arial, sans-serif">Conic</text><rect x="265" y="305" width="262.8" height="15" rx="3" fill="#49d3c6"/><rect x="265" y="324" width="432" height="15" rx="3" fill="#71a9ff"/><text x="536.8" y="318" font-size="15" fill="#cafef5" font-family="Arial">0.73</text><text x="706" y="337" font-size="15" fill="#d9e8ff" font-family="Arial">1.20</text>
<text x="42" y="383" fill="#e8f2ff" font-size="21" font-family="Arial, sans-serif">Bowed</text><rect x="265" y="365" width="226.8" height="15" rx="3" fill="#49d3c6"/><rect x="265" y="384" width="435.6" height="15" rx="3" fill="#71a9ff"/><text x="500.8" y="378" font-size="15" fill="#cafef5" font-family="Arial">0.63</text><text x="709.6" y="397" font-size="15" fill="#d9e8ff" font-family="Arial">1.21</text>
